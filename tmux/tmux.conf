set -g default-terminal "tmux-256color"
# Ghostty: true colour + undercurl/coloured underlines (LSP diagnostics)
set -as terminal-features ",xterm-ghostty:RGB,xterm-ghostty:usstyle"
set -g focus-events on   # lets nvim autoread/gitsigns refresh on pane focus
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows 1

set -g status-bg black
set -g status-fg white

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix   # press C-Space twice to send it to the app (e.g. nvim completion)

# window switching: prefix-based so nvim keeps C-o (jump back) and C-y (scroll)
bind C-y previous-window
bind C-o next-window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"   # matches <leader>- in nvim
bind C-l send-keys 'C-l'   # clear screen (plain C-l is used by vim-tmux-navigator)

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key g new-window -n "lazygit" -c "#{pane_current_path}" "lazygit"
bind-key v send-keys "nvim" C-m
bind-key V new-window -n "nvim" -c "#{pane_current_path}" "nvim"

set -g history-limit 50000

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
